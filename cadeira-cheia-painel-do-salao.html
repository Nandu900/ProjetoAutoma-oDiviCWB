<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 "Public Sans",-apple-system,system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Cadeira Cheia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#F2F5F4;
  --surface:#FFFFFF;
  --surface-2:#E9EEEC;
  --ink:#141D1B;
  --ink-2:#3C4C49;
  --muted:#6B7C78;
  --line:#D9E1DE;
  --line-strong:#C2CECA;
  --accent:#0E6B5E;
  --accent-soft:#D9EBE7;
  --accent-ink:#0A4F45;
  --on-accent:#FFFFFF;
  --ok:#2E7D53;      --ok-soft:#DCEFE2;
  --warn:#9C6A14;    --warn-soft:#F6E9D2;
  --crit:#A93C36;    --crit-soft:#F7DEDC;
  --p1:#0E6B5E;      --p1-soft:#D9EBE7;
  --p2:#9C6A14;      --p2-soft:#F6E9D2;
  --p3:#3F529B;      --p3-soft:#E1E6F5;
  --shadow:0 1px 2px rgba(20,29,27,.05), 0 10px 28px -16px rgba(20,29,27,.30);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1413;
    --surface:#151E1C;
    --surface-2:#1E2A27;
    --ink:#E9EFED;
    --ink-2:#BDC9C6;
    --muted:#889894;
    --line:#26332F;
    --line-strong:#374843;
    --accent:#3FAD99;
    --accent-soft:#12302B;
    --accent-ink:#8FD8CA;
    --on-accent:#08201C;
    --ok:#52B37E;    --ok-soft:#122A1F;
    --warn:#D6A33F;  --warn-soft:#2E2413;
    --crit:#D9635B;  --crit-soft:#321A18;
    --p1:#3FAD99;    --p1-soft:#12302B;
    --p2:#D6A33F;    --p2-soft:#2E2413;
    --p3:#7E90D8;    --p3-soft:#1A1F33;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1413;
  --surface:#151E1C;
  --surface-2:#1E2A27;
  --ink:#E9EFED;
  --ink-2:#BDC9C6;
  --muted:#889894;
  --line:#26332F;
  --line-strong:#374843;
  --accent:#3FAD99;
  --accent-soft:#12302B;
  --accent-ink:#8FD8CA;
  --on-accent:#08201C;
  --ok:#52B37E;    --ok-soft:#122A1F;
  --warn:#D6A33F;  --warn-soft:#2E2413;
  --crit:#D9635B;  --crit-soft:#321A18;
  --p1:#3FAD99;    --p1-soft:#12302B;
  --p2:#D6A33F;    --p2-soft:#2E2413;
  --p3:#7E90D8;    --p3-soft:#1A1F33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;font-weight:800;letter-spacing:-.015em;margin:0;text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.side{
  width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;
  top:env(safe-area-inset-top,0px);height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;flex:0 0 auto}
.brand .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.1}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;
  border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .ic{width:17px;height:17px;flex:0 0 auto}
.navbtn .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:11px;
  padding:1px 6px;font-weight:600}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 22px;border-bottom:1px solid var(--line);background:var(--surface);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar h1{font-size:19px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.view{padding:22px;max-width:1280px;width:100%}

/* ---------- atoms ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;
  letter-spacing:.01em;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 28%,transparent)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dot{width:8px;height:8px;border-radius:99px;flex:0 0 auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);
  border-radius:9px;padding:8px 10px;width:100%}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field{margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- agenda ---------- */
.agenda-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.datenav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:2px}
.datenav button{border:0;background:transparent;cursor:pointer;padding:6px 9px;border-radius:7px;color:var(--ink-2)}
.datenav button:hover{background:var(--surface-2)}
.datelabel{padding:0 10px;font-weight:600;white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;cursor:pointer;padding:5px 12px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.grid{display:grid;min-width:640px}
.grid .hcell{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line-strong);
  padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.grid .hcell .cap{font-size:11px;color:var(--muted);font-weight:500;margin-left:auto}
.timecol{border-right:1px solid var(--line);background:var(--surface)}
.tlabel{height:30px;font-size:11px;color:var(--muted);text-align:right;padding:2px 8px 0 0}
.tlabel.hour{color:var(--ink-2);font-weight:600}
.col{position:relative;border-right:1px solid var(--line)}
.col:last-child{border-right:0}
.slot{height:30px;border-bottom:1px solid var(--line);cursor:pointer}
.slot.hourline{border-bottom-color:var(--line-strong)}
.slot.off{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 60%,transparent) 6px 7px);cursor:not-allowed}
.slot:not(.off):hover{background:var(--accent-soft)}
.appt{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 7px;cursor:pointer;overflow:hidden;
  border-left:3px solid var(--pc,var(--accent));background:var(--pcs,var(--accent-soft));color:var(--ink);
  font-size:12px;line-height:1.25;box-shadow:var(--shadow)}
.appt:hover{filter:brightness(.97)}
.appt .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .what{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .tm{font-size:10.5px;color:var(--muted)}
.appt.done{opacity:.62}
.appt.cancel{opacity:.5;text-decoration:line-through}
.appt.block{background:var(--surface-2);border-left-color:var(--line-strong);color:var(--muted)}
.appt .flag{position:absolute;top:5px;right:6px;font-size:10px;font-weight:700;letter-spacing:.04em}

.weekgrid{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:10px;min-width:760px}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px;display:flex;flex-direction:column;gap:7px}
.daycard.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.daycard h4{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.daycard .dnum{font-size:11px;color:var(--muted);font-weight:500}
.miniappt{font-size:11.5px;padding:4px 6px;border-radius:6px;border-left:3px solid var(--pc);background:var(--pcs);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daysum{margin-top:auto;padding-top:7px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

/* ---------- dashboard ---------- */
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:99px;flex:0 0 auto;
  border:1px dashed var(--line-strong);background:transparent;color:var(--muted);padding:0;line-height:1;
  font-size:10px;font-weight:700;font-style:italic;font-family:"Public Sans",sans-serif;cursor:help;position:relative}
.info:hover,.info:focus{border-style:solid;border-color:var(--accent);color:var(--accent-ink)}
#tipbox{position:fixed;left:0;top:-9999px;z-index:200;background:var(--ink);color:var(--bg);
  padding:9px 12px;border-radius:9px;box-shadow:var(--shadow);text-align:left;
  font:400 11.5px/1.45 "Public Sans",system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .12s ease}
#tipbox.on{opacity:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px}
.kpi .lb{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;justify-content:space-between}
.kpi .vl{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:25px;letter-spacing:-.02em;margin-top:5px;
  font-variant-numeric:tabular-nums}
.kpi .dt{font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--muted)}
.kpi .dt b{font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--crit)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.chart h3{font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.chart .cap{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.wide{grid-column:1 / -1}

/* ---------- tables / lists ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--accent-ink)}
th .arr{margin-left:4px;font-size:9px;opacity:.3}
th[aria-sort] .arr{opacity:1;color:var(--accent)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.avatar{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 auto}
.cellname{display:flex;align-items:center;gap:9px}
.cellname .nm{font-weight:600}
.cellname .ph{font-size:11.5px;color:var(--muted)}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.expwrap{position:relative;margin-left:auto}
.expmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);min-width:168px;overflow:visible}
.expopt{position:relative;display:flex;align-items:baseline;gap:8px;width:100%;padding:9px 12px;border:0;
  background:transparent;cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.expopt:last-child{border-bottom:0}
.expopt:hover,.expopt:focus-visible{background:var(--accent-soft)}
.expopt b{font-size:13px}
.expopt span{font-size:11.5px;color:var(--muted)}
.expopt::after{content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);
  width:215px;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:11.5px;line-height:1.35;
  opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:40}
.expopt:hover::after,.expopt:focus-visible::after{opacity:1}
@media (max-width:620px){
  .expwrap{margin-left:0}
  .expopt::after{right:auto;left:0;top:calc(100% + 4px);transform:none;width:min(240px,72vw)}
}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{max-width:260px}

.fu{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.fulist{display:flex;flex-direction:column}
.fuitem{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:flex-start}
.fuitem:last-child{border-bottom:0}
.fuitem .bd{min-width:0;flex:1}
.fuitem .why{font-size:12px;color:var(--muted);margin-top:2px}
.msg{margin-top:8px;background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--ink-2);
  border-left:2px solid var(--accent)}
.fuacts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.done-note{font-size:12px;color:var(--ok);font-weight:600;margin-top:8px}
.cardhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cardhead h3{font-size:14.5px}
.cardhead .cap{font-size:11.5px;color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- drawer + modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,17,.45);z-index:60;display:flex;justify-content:flex-end}
.scrim.center{align-items:center;justify-content:center;padding:16px}
.drawer{width:min(420px,100%);background:var(--surface);height:100%;overflow-y:auto;
  border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px;max-height:100%;overflow-y:auto;box-shadow:var(--shadow)}
.ac{position:relative}
.aclista{margin-top:6px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:10px;max-height:206px;overflow-y:auto}
.aclista .op{padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
.aclista .op:last-child{border-bottom:0}
.aclista .op:hover,.aclista .op.ativo{background:var(--accent-soft)}
.aclista .bd{min-width:0}
.aclista .sub,.acsel .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aclista .vazio{padding:10px 11px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.acsel{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:9px;padding:8px 11px}
.acsel .bd{min-width:0;flex:1}
.dh{display:flex;align-items:flex-start;gap:12px}
.dh h2{font-size:18px}
.dh .cl{margin-left:auto}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.meta .m{background:var(--surface-2);border-radius:9px;padding:9px 11px}
.meta .m .l{font-size:11px;color:var(--muted);font-weight:600}
.meta .m .v{font-weight:700;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:0}
.hist .h{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.hist .h:last-child{border-bottom:0}
.hist .h .d{font-size:11.5px;color:var(--muted);width:62px;flex:0 0 auto}
.hist .h .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.loyal{display:flex;gap:5px;flex-wrap:wrap}
.stamp{width:21px;height:21px;border-radius:99px;border:1.5px dashed var(--line-strong);display:grid;place-items:center;font-size:10px;color:var(--muted)}
.stamp.on{background:var(--accent);border:1.5px solid var(--accent);color:var(--on-accent);font-weight:700}
.stsel{display:flex;gap:7px;flex-wrap:wrap}
.stopt{padding:7px 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);
  cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.stopt:hover{border-color:var(--accent);color:var(--accent-ink)}
.stopt.on{font-weight:700;cursor:default}
.stopt.on.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.stopt.on.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.stopt.on.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.stopt.on.neutral{background:var(--surface-2);color:var(--ink);border-color:var(--line-strong)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));

<script>
(function(){
"use strict";

/* ============================= utilidades ============================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20260922);
const ri = (a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((a-b)/86400000);
const BRL = v => "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0});
const BRL2 = v => "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hm = m => pad(Math.floor(m/60))+":"+pad(m%60);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const WDL = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MO = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtD = d => WD[d.getDay()]+", "+d.getDate()+" "+MO[d.getMonth()];
const initials = n => n.split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();

const TODAY = new Date(); TODAY.setHours(0,0,0,0);

/* ============================= cadastro base ============================= */
const SHOP = { nome:"Studio Vito", metaFidelidade:10, gradeMin:30, abre:8*60, fecha:20*60 };

const PROS = [
  {id:"p1",nome:"Vanessa Rocha", papel:"Cabeleireira", cor:"--p1", soft:"--p1-soft", dias:[1,2,3,4,5,6], ini:9*60,  fim:19*60},
  {id:"p2",nome:"Diego Prado",   papel:"Barbeiro",     cor:"--p2", soft:"--p2-soft", dias:[2,3,4,5,6],   ini:10*60, fim:20*60},
  {id:"p3",nome:"Juliana Sá",    papel:"Manicure",     cor:"--p3", soft:"--p3-soft", dias:[1,2,3,4,5],   ini:9*60,  fim:18*60}
];
const proById = id => PROS.find(p=>p.id===id);

const SERVICOS = [
  {id:"s1", nome:"Corte feminino",  dur:60,  preco:80,  pro:["p1"]},
  {id:"s2", nome:"Escova",          dur:45,  preco:60,  pro:["p1"]},
  {id:"s3", nome:"Hidratação",      dur:60,  preco:110, pro:["p1"]},
  {id:"s4", nome:"Coloração",       dur:120, preco:220, pro:["p1"]},
  {id:"s5", nome:"Luzes / mechas",  dur:150, preco:320, pro:["p1"]},
  {id:"s6", nome:"Progressiva",     dur:180, preco:380, pro:["p1"]},
  {id:"s7", nome:"Corte masculino", dur:30,  preco:45,  pro:["p2"]},
  {id:"s8", nome:"Corte + barba",   dur:60,  preco:75,  pro:["p2"]},
  {id:"s9", nome:"Barba",           dur:30,  preco:35,  pro:["p2"]},
  {id:"s10",nome:"Manicure",        dur:45,  preco:45,  pro:["p3"]},
  {id:"s11",nome:"Pé e mão",        dur:75,  preco:80,  pro:["p3"]},
  {id:"s12",nome:"Esmaltação em gel",dur:60, preco:95,  pro:["p3"]}
];
const srvById = id => SERVICOS.find(s=>s.id===id);

// 30 primeiros nomes femininos, depois 30 masculinos — o índice define o perfil de serviço
const PRIMEIROS = ["Ana Beatriz","Carla","Juliana","Patrícia","Fernanda","Letícia","Camila","Simone","Renata","Mariana",
"Débora","Vivian","Aline","Tatiane","Bianca","Priscila","Larissa","Natália","Elaine","Roberta","Manuela","Yasmin",
"Sabrina","Cristina","Gabriela","Isabela","Adriana","Kelly","Lívia","Vanda",
"Marcos","Rafael","Bruno","Eduardo","Thiago","Gustavo","Rodrigo","Felipe","André","Otávio","Leandro","Caio","Henrique",
"Murilo","Wesley","Igor","Sérgio","Danilo","Alexandre","Ricardo","Paulo Renato","Everton","Joel","Marcelo","Fábio",
"Nelson","Douglas","Emerson","Jonas","Vitor Hugo"];
const SOBRENOMES = ["Lima","Sales","Menezes","Tavares","Prado","Carvalho","Nogueira","Ramos","Bastos","Moura","Campos",
"Pinheiro","Duarte","Aguiar","Barreto","Queiroz","Vasques","Lacerda","Fontes","Bezerra","Antunes","Pacheco","Cordeiro",
"Medeiros","Portela","Vilela","Rosa","Andrade","Serra","Cunha","Amaral","Bandeira","Peixoto","Mattos","Guedes","Paes",
"Siqueira","Freitas","Xavier","Pontes","Braga","Sampaio","Correia","Dias","Leal","Maciel","Bueno","Ferraz","Nunes","Tanaka"];
const TOTAL_CLIENTES = 700;

function telefone(){ return "(11) 9"+ri(4000,9999)+"-"+ri(1000,9999); }

/* ============================= geração de dados ============================= */
// Cada cliente ganha uma frequência própria e um "atraso" que o coloca numa faixa.
const CLIENTES = [];
const perfis = [
  {pros:["p1"], servs:["s1","s2","s3"],           freq:[21,32]},   // 0 cabelo rotina
  {pros:["p1"], servs:["s1","s4","s5","s6"],      freq:[50,80]},   // 1 química
  {pros:["p2"], servs:["s7","s8","s9"],           freq:[14,21]},   // 2 barbearia semanal
  {pros:["p2"], servs:["s7","s9"],                freq:[22,32]},   // 3 barbearia mensal
  {pros:["p3"], servs:["s10","s11","s12"],        freq:[15,24]},   // 4 unhas
  {pros:["p1","p3"], servs:["s1","s2","s10"],     freq:[26,40]}    // 5 combinado
];
const PERF_F = [0,0,0,1,1,4,4,5];   // sorteio ponderado para clientes femininas
const PERF_M = [2,3,3];
for(let i=0;i<TOTAL_CLIENTES;i++){
  const pi = i % PRIMEIROS.length;
  const nome = PRIMEIROS[pi] + " " + SOBRENOMES[(i*17 + Math.floor(i/PRIMEIROS.length)*7) % SOBRENOMES.length];
  const perfil = perfis[ pi < 30 ? pick(PERF_F) : pick(PERF_M) ];
  const freq = ri(perfil.freq[0], perfil.freq[1]);
  const novo = rnd() < .055;
  // distribuição proposital de faixas de recência
  let mult;
  const r = rnd();
  if(r < .68) mult = .02 + rnd()*1.10;      // em dia
  else if(r < .86) mult = 1.25 + rnd()*.7;  // atrasado
  else if(r < .95) mult = 2.1 + rnd()*.85;  // em risco
  else mult = 3.2 + rnd()*1.6;              // perdido
  CLIENTES.push({
    id:"c"+(i+1), nome, tel:telefone(), perfil, freq,
    ultimoGap: Math.round(freq*mult), novo, churn: mult>2,
    obs: pick(["","","","","Prefere horário no fim do dia.","Corte na máquina 2 nas laterais.","Alergia a amônia.","Café sem açúcar.","Vem com a filha.","Costuma atrasar 10 min.","Cabelo muito fino, escova leve."])
  });
}

const AGENDAMENTOS = [];
let seqId = 1;

function novaVisita(cliente, data, servico, proId, status){
  const s = srvById(servico);
  AGENDAMENTOS.push({
    id:"a"+(seqId++), clienteId:cliente.id, servicoId:servico, proId,
    data:iso(data), inicio:0, dur:s.dur, preco:s.preco, status, encaixe:false, bloco:false
  });
}

// monta o histórico de visitas de cada cliente
CLIENTES.forEach(c=>{
  const proId = pick(c.perfil.pros);
  if(c.novo){
    const g1 = ri(2, 26);
    let d1 = addDays(TODAY, -g1);
    if(d1.getDay()===0) d1 = addDays(d1,-1);
    novaVisita(c, d1, pick(c.perfil.servs), proId, "atendido");
    if(rnd() < .45){                       // parte dos novos já voltou uma vez
      let d2 = addDays(TODAY, -(g1 + ri(18, 45)));
      if(d2.getDay()===0) d2 = addDays(d2,-1);
      novaVisita(c, d2, pick(c.perfil.servs), proId, "atendido");
    }
    return;
  }
  let gap = c.ultimoGap;
  let visitas = 0;
  const teto = c.churn ? 4 : 9;
  while(gap < 170 && visitas < teto){
    let d = addDays(TODAY, -gap);
    let guard=0;
    while(d.getDay()===0 && guard++<3) d = addDays(d,-1);
    const st = rnd()<.065 ? (rnd()<.45?"cancelado":"faltou") : "atendido";
    novaVisita(c, d, pick(c.perfil.servs), proId, st);
    gap += Math.max(7, Math.round(c.freq * (0.8 + rnd()*0.55)));
    visitas++;
  }
});

// agendamentos futuros: clientes em dia voltam nos próximos dias
CLIENTES.forEach(c=>{
  if(c.novo) return;
  const proximo = c.freq - c.ultimoGap;
  if(proximo >= 0 && proximo <= 9){
    let d = addDays(TODAY, Math.max(0, proximo));
    let guard=0;
    while(d.getDay()===0 && guard++<3) d = addDays(d,1);
    novaVisita(c, d, pick(c.perfil.servs), pick(c.perfil.pros), rnd()<.5 ? "confirmado" : "agendado");
  }
});

// bloqueios recorrentes de almoço e uma folga
(function(){
  for(let k=-120;k<=14;k++){
    const d = addDays(TODAY,k);
    if(d.getDay()===0) continue;
    PROS.forEach(p=>{
      if(!p.dias.includes(d.getDay())) return;
      AGENDAMENTOS.push({id:"b"+(seqId++), clienteId:null, servicoId:null, proId:p.id,
        data:iso(d), inicio: (p.id==="p2"?13*60:12*60), dur:60, preco:0, status:"bloqueio", bloco:true, motivo:"Almoço"});
    });
  }
})();

// distribui os horários no dia, sem sobreposição por profissional
(function(){
  const byKey = {};
  AGENDAMENTOS.forEach(a=>{ const k=a.data+"|"+a.proId; (byKey[k]=byKey[k]||[]).push(a); });
  const descartar = new Set();
  Object.keys(byKey).forEach(k=>{
    const [data,proId] = k.split("|");
    const p = proById(proId);
    const d = new Date(data+"T12:00:00");
    const lista = byKey[k];
    const blocos = lista.filter(a=>a.bloco);
    const ats = lista.filter(a=>!a.bloco);
    if(!p.dias.includes(d.getDay())){ lista.forEach(a=>descartar.add(a.id)); return; }
    const fim = d.getDay()===6 ? Math.min(p.fim, 18*60) : p.fim;
    const ocupado = blocos.map(b=>[b.inicio,b.inicio+b.dur]);
    // peso por faixa do dia: fim de tarde e meio da manhã são os horários disputados
    const peso = m => { const h=Math.floor(m/60);
      if(h>=15 && h<19) return 2.0; if(h>=10 && h<13) return 1.5; if(h>=13 && h<14) return .5; return .9; };
    ats.sort((x,y)=> y.dur - x.dur).forEach(a=>{   // serviços longos primeiro, menos fragmentação
      const cands=[];
      for(let m=p.ini; m+a.dur<=fim; m+=30){
        if(ocupado.some(([s,e])=> m < e && m+a.dur > s)) continue;
        cands.push(m);
      }
      if(!cands.length){ descartar.add(a.id); return; }
      const total = cands.reduce((s,m)=>s+peso(m),0);
      let alvo = rnd()*total, escolhido = cands[cands.length-1];
      for(const m of cands){ alvo -= peso(m); if(alvo<=0){ escolhido=m; break; } }
      a.inicio = escolhido;
      ocupado.push([escolhido, escolhido+a.dur]);
    });
  });
  for(let i=AGENDAMENTOS.length-1;i>=0;i--) if(descartar.has(AGENDAMENTOS[i].id)) AGENDAMENTOS.splice(i,1);
})();

/* ============================= consultas ============================= */
const cliById = id => CLIENTES.find(c=>c.id===id);
const noDia = d => AGENDAMENTOS.filter(a=>a.data===iso(d));
const realizados = () => AGENDAMENTOS.filter(a=>a.status==="atendido");

let IDX_CLI = {};
function reindex(){
  IDX_CLI = {};
  AGENDAMENTOS.forEach(a=>{
    if(a.clienteId && a.status==="atendido") (IDX_CLI[a.clienteId]=IDX_CLI[a.clienteId]||[]).push(a);
  });
  Object.keys(IDX_CLI).forEach(k=> IDX_CLI[k].sort((x,y)=> x.data < y.data ? 1 : -1));
}
function visitasDoCliente(id){ return IDX_CLI[id] || []; }
function statsCliente(c){
  const vs = visitasDoCliente(c.id);
  const total = vs.reduce((s,a)=>s+a.preco,0);
  const datas = vs.map(a=>new Date(a.data+"T12:00:00"));
  let freq = null;
  if(datas.length>=2){
    let soma=0;
    for(let i=0;i<datas.length-1;i++) soma += dayDiff(datas[i], datas[i+1]);
    freq = Math.max(1, Math.round(soma/(datas.length-1)));
  }
  const diasSem = datas.length ? dayDiff(TODAY, datas[0]) : null;
  let faixa="novo";
  if(datas.length<2 || !freq){ faixa = "novo"; }
  else{
    const r = diasSem/freq;
    faixa = r < 1.2 ? "em-dia" : r < 2 ? "atrasado" : r < 3 ? "em-risco" : "perdido";
  }
  const favorito = (()=>{ const c={}; vs.forEach(a=>c[a.servicoId]=(c[a.servicoId]||0)+1);
    const k = Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return k?srvById(k):null; })();
  const proFav = (()=>{ const m={}; vs.forEach(a=>m[a.proId]=(m[a.proId]||0)+1);
    const k = Object.keys(m).sort((a,b)=>m[b]-m[a])[0]; return k?proById(k):null; })();
  const desde = vs.length ? vs[vs.length-1].data : null;
  return {visitas:vs, total, freq, diasSem, faixa, favorito, proFav, desde, qtd:vs.length};
}
const FAIXAS = {
  "em-dia":  {rot:"Em dia",   cls:"ok"},
  "atrasado":{rot:"Atrasado", cls:"warn"},
  "em-risco":{rot:"Em risco", cls:"crit"},
  "perdido": {rot:"Perdido",  cls:"crit"},
  "novo":    {rot:"Novo",     cls:"accent"}
};
const ORDEM_ST = ["agendado","confirmado","atendido","faltou","cancelado"];
const STATUS = {
  agendado:{rot:"Agendado",cls:"neutral"}, confirmado:{rot:"Confirmado",cls:"accent"},
  atendido:{rot:"Atendido",cls:"ok"}, faltou:{rot:"Faltou",cls:"crit"}, cancelado:{rot:"Cancelado",cls:"neutral"}
};

// cache de stats (recalculado quando algo muda)
let STATS = {};
function recalcStats(){ reindex(); STATS = {}; CLIENTES.forEach(c=>STATS[c.id]=statsCliente(c)); }
recalcStats();

/* ============================= métricas ============================= */
function periodo(ini,fim){ // inclusivo, Date
  const a=iso(ini), b=iso(fim);
  return AGENDAMENTOS.filter(x=>x.data>=a && x.data<=b);
}
function resumo(ini,fim,proFiltro){
  const xs = periodo(ini,fim).filter(x=> !proFiltro || x.proId===proFiltro);
  const at = xs.filter(x=>x.status==="atendido");
  const marcados = xs.filter(x=>!x.bloco && (x.status==="atendido"||x.status==="confirmado"||x.status==="agendado"));
  const faturamento = at.reduce((s,x)=>s+x.preco,0);
  const previsto = marcados.reduce((s,x)=>s+x.preco,0);
  const minutos = marcados.reduce((s,x)=>s+x.dur,0);
  const horasAt = at.reduce((s,x)=>s+x.dur,0)/60;
  const faltas = xs.filter(x=>x.status==="faltou").length;
  // minutos disponíveis
  let disp = 0;
  const equipe = proFiltro ? PROS.filter(p=>p.id===proFiltro) : PROS;
  for(let d=new Date(ini); d<=fim; d=addDays(d,1)){
    equipe.forEach(p=>{
      if(!p.dias.includes(d.getDay())) return;
      const fimJ = d.getDay()===6 ? Math.min(p.fim,18*60) : p.fim;
      disp += (fimJ - p.ini);
    });
  }
  const bloq = xs.filter(x=>x.bloco).reduce((s,x)=>s+x.dur,0);
  disp = Math.max(1, disp - bloq);
  return {
    faturamento, previsto, atendimentos:at.length, marcados:marcados.length,
    ticket: at.length ? faturamento/at.length : 0,
    horas: horasAt,
    ocupacao: minutos/disp,
    noshow: (at.length+faltas) ? faltas/(at.length+faltas) : 0
  };
}
function inicioSemana(d){ const x=new Date(d); const w=(x.getDay()+6)%7; return addDays(x,-w); }

/* ============================= estado de navegação ============================= */
let nav = "agenda";
let agendaDia = new Date(TODAY);
let agendaModo = "dia";
let filtroPro = "todos";
let filtroFaixa = "todas";
let ordem = {campo:"total", dir:"desc"};
let DOWNLOADS = null, menuExp = false;
let busca = "";
const contatados = new Set();
const confirmadosHoje = new Set();

function toast(msg){
  const host = document.getElementById("toast-host");
  host.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  setTimeout(()=>{ host.innerHTML=""; }, 2200);
}

/* ============================= render: agenda ============================= */
function agendaHTML(){
  const cols = filtroPro==="todos" ? PROS : PROS.filter(p=>p.id===filtroPro);
  const d = agendaDia;
  const aberto = d.getDay()!==0;
  const slots = [];
  for(let m=SHOP.abre; m<SHOP.fecha; m+=30) slots.push(m);

  let head = '<div class="agenda-bar">'+
    '<div class="datenav">'+
      '<button data-go="-1" aria-label="Dia anterior">‹</button>'+
      '<span class="datelabel">'+esc(fmtD(d))+'</span>'+
      '<button data-go="1" aria-label="Próximo dia">›</button>'+
    '</div>'+
    '<button class="btn sm" data-go="hoje">Hoje</button>'+
    '<div class="seg" role="group" aria-label="Modo de visualização">'+
      '<button data-modo="dia" aria-pressed="'+(agendaModo==="dia")+'">Dia</button>'+
      '<button data-modo="semana" aria-pressed="'+(agendaModo==="semana")+'">Semana</button>'+
    '</div>'+
    '<div class="spacer"></div>'+
    '<div class="seg" role="group" aria-label="Profissional">'+
      '<button data-pro="todos" aria-pressed="'+(filtroPro==="todos")+'">Todos</button>'+
      PROS.map(p=>'<button data-pro="'+p.id+'" aria-pressed="'+(filtroPro===p.id)+'">'+esc(p.nome.split(" ")[0])+'</button>').join("")+
    '</div>'+
  '</div>';

  if(agendaModo==="semana") return head + semanaHTML();

  if(!aberto){
    return head + '<div class="card"><div class="empty">Studio fechado aos domingos. Use as setas para ver outro dia.</div></div>';
  }

  const rowH = 30;
  let grid = '<div class="gridwrap"><div class="grid" style="grid-template-columns:56px repeat('+cols.length+',minmax(150px,1fr))">';
  grid += '<div class="hcell" style="justify-content:flex-end"></div>';
  cols.forEach(p=>{
    const dia = noDia(d).filter(a=>a.proId===p.id && a.status!=="cancelado" && !a.bloco);
    grid += '<div class="hcell"><span class="dot" style="background:var('+p.cor+')"></span>'+esc(p.nome)+
            '<span class="cap">'+dia.length+' hor.</span></div>';
  });
  // coluna de horas
  grid += '<div class="timecol">'+slots.map(m=>'<div class="tlabel'+(m%60===0?' hour':'')+'">'+(m%60===0?hm(m):"")+'</div>').join("")+'</div>';

  cols.forEach(p=>{
    const trabalha = p.dias.includes(d.getDay());
    const fimJ = d.getDay()===6 ? Math.min(p.fim,18*60) : p.fim;
    let col = '<div class="col" data-pro="'+p.id+'" style="height:'+(slots.length*rowH)+'px">';
    slots.forEach(m=>{
      const off = !trabalha || m < p.ini || m >= fimJ;
      col += '<div class="slot'+(m%60===30?' hourline':'')+(off?' off':'')+'" data-slot="'+m+'" data-pro="'+p.id+'"></div>';
    });
    noDia(d).filter(a=>a.proId===p.id).forEach(a=>{
      const top = ((a.inicio - SHOP.abre)/30)*rowH;
      const h = Math.max(26,(a.dur/30)*rowH - 3);
      if(a.bloco){
        col += '<div class="appt block" style="top:'+top+'px;height:'+h+'px" data-appt="'+a.id+'">'+
               '<div class="who">'+esc(a.motivo||"Bloqueado")+'</div><div class="tm">'+hm(a.inicio)+'</div></div>';
        return;
      }
      const c = cliById(a.clienteId), s = srvById(a.servicoId);
      const cls = a.status==="atendido" ? " done" : (a.status==="cancelado"||a.status==="faltou") ? " cancel" : "";
      const flag = a.status==="confirmado" ? "✓" : a.status==="faltou" ? "!" : "";
      col += '<div class="appt'+cls+'" data-appt="'+a.id+'" style="top:'+top+'px;height:'+h+'px;--pc:var('+p.cor+');--pcs:var('+p.soft+')">'+
             (flag?'<span class="flag">'+flag+'</span>':'')+
             '<div class="who">'+esc(c?c.nome:"—")+'</div>'+
             (h>40?'<div class="what">'+esc(s.nome)+'</div>':'')+
             (h>58?'<div class="tm">'+hm(a.inicio)+'–'+hm(a.inicio+a.dur)+' · '+BRL(a.preco)+'</div>':'')+
             '</div>';
    });
    col += '</div>';
    grid += col;
  });
  grid += '</div></div>';

  const soPro = filtroPro==="todos" ? null : filtroPro;
  const r = resumo(d, d, soPro);
  const quem = soPro ? esc(proById(soPro).nome.split(" ")[0])+' neste dia' : 'Neste dia';
  const corBarra = soPro ? proById(soPro).cor : "--accent";
  const trabalha = !soPro || proById(soPro).dias.includes(d.getDay());
  const resumoDia = '<div class="demo" style="margin-top:14px;border-left-color:var('+corBarra+')">'+
    (trabalha
      ? quem+': <b>'+r.marcados+'</b> horários · <b>'+BRL(r.previsto)+'</b> previstos'+
        ' · ocupação de <b>'+Math.round(r.ocupacao*100)+'%</b>.'
      : esc(proById(soPro).nome.split(" ")[0])+' não trabalha '+WDL[d.getDay()]+'.')+
    ' Clique num horário livre para marcar, ou num agendamento para mudar o status.</div>';

  return head + grid + resumoDia;
}

function semanaHTML(){
  const ini = inicioSemana(agendaDia);
  let out = '<div class="tablewrap"><div class="weekgrid">';
  for(let i=0;i<6;i++){
    const d = addDays(ini,i);
    const ats = noDia(d).filter(a=>!a.bloco && a.status!=="cancelado")
      .filter(a=> filtroPro==="todos" || a.proId===filtroPro)
      .sort((a,b)=>a.inicio-b.inicio);
    const fat = ats.filter(a=>a.status!=="faltou").reduce((s,a)=>s+a.preco,0);
    const hoje = iso(d)===iso(TODAY);
    out += '<div class="daycard'+(hoje?" today":"")+'">'+
      '<h4>'+WD[d.getDay()]+' <span class="dnum">'+d.getDate()+"/"+pad(d.getMonth()+1)+'</span></h4>';
    if(!ats.length) out += '<div style="font-size:11.5px;color:var(--muted)">Sem horários</div>';
    ats.slice(0,8).forEach(a=>{
      const p = proById(a.proId), c = cliById(a.clienteId);
      out += '<div class="miniappt" data-appt="'+a.id+'" style="--pc:var('+p.cor+');--pcs:var('+p.soft+')">'+
             hm(a.inicio)+' '+esc(c?c.nome.split(" ")[0]:"—")+'</div>';
    });
    if(ats.length>8) out += '<div style="font-size:11px;color:var(--muted)">+'+(ats.length-8)+' outros</div>';
    out += '<div class="daysum"><span>'+ats.length+' hor.</span><span class="num">'+BRL(fat)+'</span></div></div>';
  }
  out += '</div></div>';
  return out;
}

/* ============================= gráficos ============================= */
function svgLinha(pontos, rot){
  const W=640,H=200,PL=52,PR=12,PT=12,PB=26;
  const max = Math.max(1,...pontos)*1.15;
  const x = i => PL + (i/(pontos.length-1))*(W-PL-PR);
  const y = v => PT + (1-v/max)*(H-PT-PB);
  let dPath="", aPath="";
  pontos.forEach((v,i)=>{ dPath += (i?" L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); });
  aPath = dPath+" L"+x(pontos.length-1).toFixed(1)+" "+(H-PB)+" L"+x(0).toFixed(1)+" "+(H-PB)+" Z";
  let ticks="";
  for(let k=0;k<=2;k++){
    const v = max*k/2, yy=y(v);
    ticks += '<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'+
             '<text x="'+(PL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+BRL(Math.round(v))+'</text>';
  }
  let labs="";
  [0, Math.floor(pontos.length/2), pontos.length-1].forEach(i=>{
    labs += '<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===pontos.length-1?"end":"middle")+'" font-size="11" fill="var(--muted)">'+esc(rot[i])+'</text>';
  });
  const last = pontos.length-1;
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Faturamento diário">'+
    '<defs><linearGradient id="fadeA" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>'+
    '</linearGradient></defs>'+ticks+
    '<path d="'+aPath+'" fill="url(#fadeA)"/>'+
    '<path d="'+dPath+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+x(last).toFixed(1)+'" cy="'+y(pontos[last]).toFixed(1)+'" r="4" fill="var(--accent)"/>'+
    labs+'</svg>';
}
function svgBarras(itens){ // [{rot, val, cor}]
  const W=640,H=200,PL=52,PR=12,PT=14,PB=30;
  const max = Math.max(1,...itens.map(i=>i.val))*1.18;
  const bw = (W-PL-PR)/itens.length;
  let out="";
  for(let k=0;k<=2;k++){
    const v=max*k/2, yy=PT+(1-v/max)*(H-PT-PB);
    out += '<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)"/>'+
           '<text x="'+(PL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+BRL(Math.round(v))+'</text>';
  }
  itens.forEach((it,i)=>{
    const h=(it.val/max)*(H-PT-PB), xx=PL+i*bw+bw*0.22, w=bw*0.56, yy=H-PB-h;
    out += '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(2,h).toFixed(1)+'" rx="4" fill="var('+(it.cor||"--accent")+')"/>'+
           '<text x="'+(xx+w/2).toFixed(1)+'" y="'+(yy-6).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-2)">'+BRL(it.val)+'</text>'+
           '<text x="'+(xx+w/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(it.rot)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Comparativo por barras">'+out+'</svg>';
}
function svgBarrasH(itens){
  const W=640, rowH=28, PT=6, PL=132, PR=64;
  const H = PT*2 + itens.length*rowH;
  const max = Math.max(1,...itens.map(i=>i.val));
  let out="";
  itens.forEach((it,i)=>{
    const yy = PT + i*rowH + 5, h = rowH-12;
    const w = (it.val/max)*(W-PL-PR);
    out += '<text x="'+(PL-10)+'" y="'+(yy+h/2+4).toFixed(1)+'" text-anchor="end" font-size="12" fill="var(--ink-2)">'+esc(it.rot)+'</text>'+
           '<rect x="'+PL+'" y="'+yy+'" width="'+Math.max(2,w).toFixed(1)+'" height="'+h+'" rx="4" fill="var(--accent)" opacity="'+(0.45+0.55*(it.val/max)).toFixed(2)+'"/>'+
           '<text x="'+(PL+w+8).toFixed(1)+'" y="'+(yy+h/2+4).toFixed(1)+'" font-size="11.5" font-weight="600" fill="var(--ink-2)">'+BRL(it.val)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Serviços por faturamento">'+out+'</svg>';
}
function svgHoras(vals, rot){
  const W=640,H=180,PL=34,PR=12,PT=14,PB=28;
  const max=Math.max(1,...vals)*1.2, bw=(W-PL-PR)/vals.length;
  let out="";
  vals.forEach((v,i)=>{
    const h=(v/max)*(H-PT-PB), xx=PL+i*bw+bw*0.18, w=bw*0.64, yy=H-PB-h;
    const quiet = v <= Math.max(1, Math.max(...vals)*0.28);
    out += '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(2,h).toFixed(1)+'" rx="3" fill="var('+(quiet?"--warn":"--accent")+')" opacity="'+(quiet?".85":"1")+'"/>'+
           '<text x="'+(xx+w/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+esc(rot[i])+'</text>';
  });
  out += '<text x="'+PL+'" y="10" font-size="10.5" fill="var(--muted)">atendimentos</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Atendimentos por hora do dia">'+out+'</svg>';
}

function delta(atual, anterior){
  if(!anterior) return '<span class="dt">sem base de comparação</span>';
  const p = (atual-anterior)/anterior*100;
  const cls = p>=0 ? "up":"down";
  return '<div class="dt"><b class="'+cls+'">'+(p>=0?"▲":"▼")+" "+Math.abs(p).toFixed(0)+'%</b> vs. período anterior</div>';
}

function selo(texto, fim){
  return '<button type="button" class="info'+(fim?" fim":"")+'" data-tip="'+esc(texto)+'" '+
         'aria-label="Como este número é calculado: '+esc(texto)+'">i</button>';
}

function resultadosHTML(){
  const ini = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  const mes = resumo(ini, TODAY);
  const iniAnt = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, 1);
  const fimAnt = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, TODAY.getDate());
  const mesAnt = resumo(iniAnt, fimAnt);
  const sIni = inicioSemana(TODAY), sem = resumo(sIni, TODAY);
  const semAnt = resumo(addDays(sIni,-7), addDays(sIni,-1));

  const kpis = [
    {lb:"Faturamento do mês", vl:BRL(mes.faturamento), dt:delta(mes.faturamento, mesAnt.faturamento),
     tip:"Soma do valor dos atendimentos marcados como Atendido, do dia 1º até hoje. Agendados, faltas e cancelamentos ficam de fora. A comparação usa o mesmo intervalo de dias do mês anterior."},
    {lb:"Ticket médio", vl:BRL2(mes.ticket), dt:delta(mes.ticket, mesAnt.ticket),
     tip:"Faturamento do mês dividido pelo número de atendimentos realizados. Sobe quando o mix de serviços fica mais caro, não só quando o preço sobe."},
    {lb:"Atendimentos", vl:String(mes.atendimentos), dt:delta(mes.atendimentos, mesAnt.atendimentos),
     tip:"Quantos atendimentos foram concluídos no mês corrente. Um cliente que veio três vezes conta três."},
    {lb:"Ocupação da semana", vl:Math.round(sem.ocupacao*100)+"%", dt:delta(sem.ocupacao, semAnt.ocupacao),
     tip:"Minutos com horário marcado divididos pelos minutos de jornada da semana, somando as três cadeiras. Almoço e folga saem da conta; encaixe fora da jornada pode passar de 100%."},
    {lb:"Horas trabalhadas", vl:sem.horas.toFixed(1)+"h", dt:'<div class="dt">na semana, nas 3 cadeiras</div>',
     tip:"Soma da duração dos atendimentos já realizados nesta semana, nas três cadeiras. Mede cadeira ocupada, não porta aberta."},
    {lb:"No-show do mês", vl:(mes.noshow*100).toFixed(1)+"%", dt:delta(mes.noshow, mesAnt.noshow),
     tip:"Faltas divididas por faltas mais atendidos, no mês. Cancelamento avisado não entra: ele libera a cadeira, a falta não."}
  ];

  // faturamento diário dos últimos 30 dias
  const pts=[], rot=[];
  for(let k=30;k>=1;k--){
    const d = addDays(TODAY,-k);
    pts.push(periodo(d,d).filter(a=>a.status==="atendido").reduce((s,a)=>s+a.preco,0));
    rot.push(d.getDate()+"/"+pad(d.getMonth()+1));
  }
  const porPro = PROS.map(p=>({rot:p.nome.split(" ")[0], cor:p.cor,
    val: periodo(ini,TODAY).filter(a=>a.status==="atendido"&&a.proId===p.id).reduce((s,a)=>s+a.preco,0)}));
  const porServ = SERVICOS.map(s=>({rot:s.nome,
    val: periodo(ini,TODAY).filter(a=>a.status==="atendido"&&a.servicoId===s.id).reduce((x,a)=>x+a.preco,0)}))
    .filter(x=>x.val>0).sort((a,b)=>b.val-a.val).slice(0,7);
  const horas=[], hrot=[];
  for(let h=9;h<=19;h++){ hrot.push(h+"h");
    horas.push(AGENDAMENTOS.filter(a=>a.status==="atendido"&&a.inicio>=h*60&&a.inicio<(h+1)*60).length); }
  const pior = hrot[horas.indexOf(Math.min(...horas))];

  return '<div class="demo">Todos os números são calculados sobre os agendamentos de exemplo desta sessão — mudar um status na agenda muda o painel.</div>'+
   '<div class="kpis">'+kpis.map(k=>'<div class="kpi"><div class="lb"><span>'+k.lb+'</span>'+selo(k.tip, true)+
     '</div><div class="vl">'+k.vl+'</div>'+k.dt+'</div>').join("")+'</div>'+
   '<div class="charts">'+
     '<div class="chart wide"><h3>Faturamento por dia'+selo("Quanto entrou em cada um dos últimos 30 dias, até ontem. Só conta atendimento realizado, por isso domingo e dia de folga aparecem zerados.")+'</h3><div class="cap">Últimos 30 dias até ontem, somando apenas atendimentos realizados</div>'+svgLinha(pts,rot)+'</div>'+
     '<div class="chart"><h3>Faturamento por profissional'+selo("Valor dos atendimentos realizados no mês, separado por quem atendeu. É a base para comparar cadeiras e calcular comissão.")+'</h3><div class="cap">Mês corrente</div>'+svgBarras(porPro)+'</div>'+
     '<div class="chart"><h3>Serviços que mais faturam'+selo("Faturamento do mês por serviço, os sete maiores. Ordena por dinheiro, não por volume: um serviço caro e raro pode render mais que um barato e frequente.")+'</h3><div class="cap">Mês corrente</div>'+svgBarrasH(porServ)+'</div>'+
     '<div class="chart wide"><h3>Movimento por hora do dia'+selo("Quantos atendimentos começaram em cada faixa de hora, considerando todo o histórico. As barras douradas marcam as faixas mais fracas do dia.")+'</h3><div class="cap">Todo o histórico · o horário mais fraco é '+esc(pior)+', candidato natural a promoção</div>'+svgHoras(horas,hrot)+'</div>'+
   '</div>';
}

/* ============================= clientes ============================= */
const COLUNAS = [
  {k:"nome",    rot:"Cliente",       tipo:"txt", padrao:"asc"},
  {k:"faixa",   rot:"Situação",      tipo:"num", padrao:"asc"},
  {k:"diasSem", rot:"Última visita", tipo:"num", padrao:"desc"},
  {k:"freq",    rot:"Frequência",    tipo:"num", padrao:"asc"},
  {k:"qtd",     rot:"Visitas",       tipo:"num", padrao:"desc"},
  {k:"total",   rot:"Total gasto",   tipo:"num", padrao:"desc"}
];
const RANK_FAIXA = {"em-dia":0,"atrasado":1,"em-risco":2,"perdido":3,"novo":4};
function valorCol(x, k){
  if(k==="nome")  return x.c.nome.toLocaleLowerCase("pt-BR");
  if(k==="faixa") return RANK_FAIXA[x.s.faixa];
  return x.s[k];
}
const filtrosAtivos = () => busca || filtroFaixa!=="todas" || ordem.campo!=="total" || ordem.dir!=="desc";

function linhasClientes(){
  const col = COLUNAS.find(c=>c.k===ordem.campo) || COLUNAS[5];
  const sinal = ordem.dir==="asc" ? 1 : -1;
  return CLIENTES.map(c=>({c, s:STATS[c.id]}))
    .filter(x=>x.s.qtd>0)
    .filter(x=> filtroFaixa==="todas" || x.s.faixa===filtroFaixa)
    .filter(x=> !busca || x.c.nome.toLowerCase().includes(busca) || x.c.tel.includes(busca))
    .sort((a,b)=>{
      let va = valorCol(a, col.k), vb = valorCol(b, col.k);
      if(col.tipo==="txt") return sinal * String(va).localeCompare(String(vb),"pt-BR");
      // sem valor (frequência de quem só tem uma visita) sempre no fim
      if(va==null) return 1;
      if(vb==null) return -1;
      return sinal * (va - vb);
    });
}

    }).join("") : '<tr><td colspan="6"><div class="empty">Nenhum cliente nesse filtro.</div></td></tr>')+
    '</tbody></table></div>'+
    (linhas.length>60 ? '<div class="empty" style="padding:12px">Mostrando 60 de '+linhas.length+' clientes, na ordem escolhida. Clique num título de coluna para reordenar, ou use a busca.</div>' : '')+

}

function mensagemFU(c,s){
  const nome = c.nome.split(" ")[0];
  const serv = s.favorito ? s.favorito.nome.toLowerCase() : "seu horário";
  if(s.faixa==="novo")     return "Oi, "+nome+"! Aqui é do Studio Vito. Que bom ter você com a gente. Quer já deixar o próximo horário de "+serv+" marcado?";
  if(s.faixa==="atrasado") return "Oi, "+nome+"! Faz "+s.diasSem+" dias desde seu último horário de "+serv+". Quer que eu guarde um horário essa semana?";
  if(s.faixa==="em-risco") return "Oi, "+nome+"! Senti sua falta por aqui. Tenho horário livre quinta e sexta para "+serv+" — quer que eu reserve um?";
  return "Oi, "+nome+"! Faz um tempo que você não aparece. Separei uma condição especial de retorno no horário de "+serv+". Posso te encaixar?";
}

        '<button type="submit" class="btn primary">Marcar horário</button>'+
      '</div>'+
    '</form></div></div>';

  const blocoNovo=document.getElementById("bloco-novo");
  const selPro=document.getElementById("f-pro"), selSrv=document.getElementById("f-srv");
  function popularServicos(){
    const p = selPro.value;
    const list = SERVICOS.filter(s=>s.pro.includes(p));
    selSrv.innerHTML = list.map(s=>'<option value="'+s.id+'"'+(pf.servicoId===s.id?" selected":"")+'>'+
      esc(s.nome)+' · '+s.dur+' min · '+BRL(s.preco)+'</option>').join("");
  }
  popularServicos();
  selPro.addEventListener("change", popularServicos);

  /* --- busca de cliente por digitação (a lista inteira era impraticável) --- */
  const inpCli = document.getElementById("f-cli-busca");
  const listaCli = document.getElementById("f-cli-lista");
  const caixaCli = document.getElementById("f-cli-box");
  const selCliBox = document.getElementById("f-cli-sel");
  let escolha = null;            // {tipo:"cli", id} | {tipo:"novo"}
  let opcoes = [], ativo = -1;

  function fechaLista(){ listaCli.hidden = true; inpCli.setAttribute("aria-expanded","false"); ativo = -1; }

  function chipCliente(c){
    const s = STATS[c.id], p = proById(pick2(c));
    const extra = (s && s.qtd) ? ' · '+s.qtd+' visita'+(s.qtd>1?'s':'')+(s.favorito?' · '+esc(s.favorito.nome):'') : ' · sem histórico';
    return '<span class="avatar" style="background:var('+p.soft+');color:var('+p.cor+')">'+initials(c.nome)+'</span>'+
      '<div class="bd"><b>'+esc(c.nome)+'</b><div class="sub">'+esc(c.tel)+extra+'</div></div>';
  }
  function mostraSelecionado(){
    caixaCli.hidden = true; selCliBox.hidden = false;
    blocoNovo.hidden = escolha.tipo !== "novo";
    selCliBox.innerHTML = (escolha.tipo==="cli"
      ? chipCliente(cliById(escolha.id))
      : '<span class="avatar" style="background:var(--accent-soft);color:var(--accent)">+</span>'+
        '<div class="bd"><b>Cliente novo</b><div class="sub">preencha nome e telefone abaixo</div></div>')+
      '<button type="button" class="btn sm" id="f-cli-trocar">Trocar</button>';
    document.getElementById("f-cli-trocar").addEventListener("click", ()=>{
      escolha = null; selCliBox.hidden = true; caixaCli.hidden = false; blocoNovo.hidden = true;
      inpCli.value = ""; fechaLista(); inpCli.focus();
    });
  }
  function buscarClientes(q){
    const t = q.trim().toLowerCase(), dig = q.replace(/\D/g,"");
    if(!t) return [];
    return CLIENTES.filter(c => c.nome.toLowerCase().includes(t) ||
        (dig.length>=3 && c.tel.replace(/\D/g,"").includes(dig)))
      .sort((a,b)=>{
        const ia=a.nome.toLowerCase().indexOf(t), ib=b.nome.toLowerCase().indexOf(t);
        const pa = ia<0?99:ia, pb = ib<0?99:ib;
        return pa!==pb ? pa-pb : a.nome.localeCompare(b.nome,"pt-BR");
      }).slice(0,8);
  }
  function pintaLista(){
    const q = inpCli.value, achados = buscarClientes(q);
    opcoes = achados.map(c=>({tipo:"cli", id:c.id, c}));
    opcoes.push({tipo:"novo"});
    const vazio = q.trim() && !achados.length ? '<div class="vazio">Ninguém com “'+esc(q.trim())+'” na base.</div>' : '';
    listaCli.innerHTML = vazio + opcoes.map((o,i)=>{
      if(o.tipo==="novo"){
        return '<div class="op" role="option" data-i="'+i+'">'+
          '<span class="avatar" style="background:var(--accent-soft);color:var(--accent)">+</span>'+
          '<div class="bd"><b>Cadastrar '+(q.trim()?'“'+esc(q.trim())+'”':'cliente novo')+'</b>'+
          '<div class="sub">só nome e telefone</div></div></div>';
      }
      const s = STATS[o.c.id], p = proById(pick2(o.c));
      const ult = (s && s.qtd) ? ' · última visita '+(s.diasSem===0?'hoje':'há '+s.diasSem+(s.diasSem===1?' dia':' dias')) : '';
      return '<div class="op" role="option" data-i="'+i+'">'+
        '<span class="avatar" style="background:var('+p.soft+');color:var('+p.cor+')">'+initials(o.c.nome)+'</span>'+
        '<div class="bd"><b>'+esc(o.c.nome)+'</b><div class="sub">'+esc(o.c.tel)+ult+'</div></div></div>';
    }).join("");
    listaCli.hidden = false; inpCli.setAttribute("aria-expanded","true");
    marcaAtivo();
  }
  function marcaAtivo(){
    Array.prototype.forEach.call(listaCli.querySelectorAll(".op"), (el,i)=> el.classList.toggle("ativo", i===ativo));
  }
  function escolher(i){
    const o = opcoes[i]; if(!o) return;
    const q = inpCli.value.trim();
    escolha = o.tipo==="cli" ? {tipo:"cli", id:o.id} : {tipo:"novo"};
    fechaLista(); mostraSelecionado();
    if(o.tipo==="novo"){ const n=document.getElementById("f-nome"); n.value=q; n.focus(); }
  }
  inpCli.addEventListener("input", pintaLista);
  inpCli.addEventListener("focus", pintaLista);
  inpCli.addEventListener("blur", ()=> setTimeout(fechaLista, 130));
  inpCli.addEventListener("keydown", e=>{
    if(listaCli.hidden){ if(e.key==="ArrowDown") pintaLista(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); ativo=Math.min(ativo+1, opcoes.length-1); marcaAtivo(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); ativo=Math.max(ativo-1, 0); marcaAtivo(); }
    else if(e.key==="Enter"){ e.preventDefault(); escolher(ativo<0?0:ativo); }
    else if(e.key==="Escape"){ e.stopPropagation(); fechaLista(); }
  });
  listaCli.addEventListener("mousedown", e=>{
    const op = e.target.closest(".op"); if(!op) return;
    e.preventDefault(); escolher(parseInt(op.dataset.i,10));
  });
  if(pf.clienteId && cliById(pf.clienteId)){ escolha={tipo:"cli", id:pf.clienteId}; mostraSelecionado(); }
  else setTimeout(()=>inpCli.focus(), 30);

    const aviso = document.getElementById("f-aviso");

    const inicio = parseInt(document.getElementById("f-hora").value,10);
    const p = proById(proId);
    const dd = new Date(data+"T12:00:00");
    if(dd.getDay()===0){ aviso.hidden=false; aviso.textContent="O studio não abre aos domingos."; return; }
    if(!p.dias.includes(dd.getDay())){ aviso.hidden=false; aviso.textContent=p.nome+" não trabalha "+WDL[dd.getDay()]+"."; return; }
    const fimJ = dd.getDay()===6 ? Math.min(p.fim,18*60) : p.fim;
    if(inicio < p.ini || inicio+srv.dur > fimJ){
      aviso.hidden=false;
      aviso.textContent="Fora da jornada de "+p.nome.split(" ")[0]+" ("+hm(p.ini)+" às "+hm(fimJ)+").";
      return;
    }
    const conflito = AGENDAMENTOS.find(a=>a.data===data && a.proId===proId && a.status!=="cancelado" &&
      inicio < a.inicio+a.dur && inicio+srv.dur > a.inicio);
    if(conflito){
      const livre = proximoLivre(data, proId, srv.dur, inicio, fimJ);
      aviso.hidden=false;
      aviso.textContent = "Conflito com outro horário." + (livre!==null ? " Próximo livre: "+hm(livre)+"." : "");
      return;
    }
    if(!escolha){
      aviso.hidden=false; aviso.textContent="Busque o cliente pelo nome, ou cadastre um novo.";
      inpCli.focus(); return;
    }
    let cliId = escolha.id;
    if(escolha.tipo==="novo"){
      const nome=(document.getElementById("f-nome").value||"").trim();
      if(!nome){ aviso.hidden=false; aviso.textContent="Informe o nome do cliente."; return; }
      const novo = {id:"c"+(CLIENTES.length+1)+"-"+(seqId++), nome,
        tel:(document.getElementById("f-tel").value||telefone()), perfil:perfis[0], freq:30, novo:true, obs:""};
      CLIENTES.push(novo); cliId = novo.id;
    }
    AGENDAMENTOS.push({id:"a"+(seqId++), clienteId:cliId, servicoId:srv.id, proId, data,
      inicio, dur:srv.dur, preco:srv.preco, status:"agendado", bloco:false});
    recalcStats();
    agendaDia = new Date(data+"T12:00:00"); agendaDia.setHours(0,0,0,0);
    fecharOverlay(); render(); toast("Horário marcado para "+hm(inicio));
  });
}
function proximoLivre(data, proId, dur, apartir, fimJ){
  for(let m=apartir; m+dur<=fimJ; m+=30){
    const bate = AGENDAMENTOS.some(a=>a.data===data && a.proId===proId && a.status!=="cancelado" &&
      m < a.inicio+a.dur && m+dur > a.inicio);
    if(!bate) return m;
  }
  return null;
}

  } else { toast("Copie manualmente"); }

function montaCSV(){
  const sep = ";";
  const campo = v => {
    const t = (v===null || v===undefined) ? "" : String(v);
    return /[";\n\r]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
  };
  const out = [COLS_EXP.map(c=>campo(c[0])).join(sep)];
  linhasClientes().forEach(x => out.push(COLS_EXP.map(c=>campo(c[1](x))).join(sep)));
  return "﻿" + out.join("\r\n");   // BOM para o Excel ler os acentos
}

/* --- gerador mínimo de .xlsx (zip sem compressão, sem biblioteca externa) --- */
const CRCT = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0; }

function zipar(arquivos){
  const enc = new TextEncoder(), partes = [], central = [];
  let offset = 0, total = 0;
  arquivos.forEach(f=>{
    const nome = enc.encode(f.nome), dados = enc.encode(f.texto), crc = crc32(dados);
    const lh = new Uint8Array(30 + nome.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, dados.length, true); dv.setUint32(22, dados.length, true);
    dv.setUint16(26, nome.length, true); dv.setUint16(28, 0, true);
    lh.set(nome, 30);
    partes.push(lh, dados);
    const cd = new Uint8Array(46 + nome.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, dados.length, true); cv.setUint32(24, dados.length, true);
    cv.setUint16(28, nome.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nome, 46);
    central.push(cd);
    offset += lh.length + dados.length;
    total += lh.length + dados.length;
  });
  const tamCentral = central.reduce((n,c)=>n+c.length, 0);
  const eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, arquivos.length, true); ev.setUint16(10, arquivos.length, true);
  ev.setUint32(12, tamCentral, true); ev.setUint32(16, total, true); ev.setUint16(20, 0, true);
  const saida = new Uint8Array(total + tamCentral + 22);
  let pos = 0;
  partes.forEach(b=>{ saida.set(b, pos); pos += b.length; });
  central.forEach(b=>{ saida.set(b, pos); pos += b.length; });
  saida.set(eocd, pos);
  return saida;
}

const xesc = v => String(v).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
                           .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
function colLetra(i){ let s="", n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }

function montaXLSX(){
  const linhas = linhasClientes();
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const NS  = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const R   = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  let corpo = '<row r="1">' + COLS_EXP.map((c,i)=>
      '<c r="'+colLetra(i)+'1" s="1" t="inlineStr"><is><t>'+xesc(c[0])+'</t></is></c>').join("") + '</row>';
  linhas.forEach((x, li)=>{
    const r = li + 2;
    corpo += '<row r="'+r+'">' + COLS_EXP.map((c,i)=>{
      const ref = colLetra(i)+r, v = c[1](x), tipo = c[2];
      if((tipo==="int" || tipo==="brl") && typeof v === "number" && isFinite(v))
        return '<c r="'+ref+'"'+(tipo==="brl" ? ' s="2"' : '')+'><v>'+v+'</v></c>';
      if(v === null || v === undefined || v === "") return '<c r="'+ref+'"/>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';
    }).join("") + '</row>';
  });
  const ultima = colLetra(COLS_EXP.length-1), fim = linhas.length + 1;
  const cols = '<cols>' + COLS_EXP.map((c,i)=>
      '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+c[3]+'" customWidth="1"/>').join("") + '</cols>';

  const sheet = XML+'<worksheet xmlns="'+NS+'">'+
    '<dimension ref="A1:'+ultima+fim+'"/>'+
    '<sheetViews><sheetView workbookViewId="0" tabSelected="1">'+
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/>'+ cols +
    '<sheetData>'+corpo+'</sheetData>'+
    '<autoFilter ref="A1:'+ultima+fim+'"/>'+
    '</worksheet>';

  const styles = XML+'<styleSheet xmlns="'+NS+'">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;R$&quot;\\ #,##0"/></numFmts>'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="2"><fill><patternFill patternType="none"/></fill>'+
      '<fill><patternFill patternType="gray125"/></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="3">'+
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';

  return zipar([
    {nome:"[Content_Types].xml", texto: XML+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      '</Types>'},
    {nome:"_rels/.rels", texto: XML+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {nome:"xl/workbook.xml", texto: XML+
      '<workbook xmlns="'+NS+'" xmlns:r="'+R+'"><sheets>'+
      '<sheet name="Clientes" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {nome:"xl/_rels/workbook.xml.rels", texto: XML+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/worksheet" Target="worksheets/sheet1.xml"/>'+
      '<Relationship Id="rId2" Type="'+R+'/styles" Target="styles.xml"/></Relationships>'},
    {nome:"xl/styles.xml", texto: styles},
    {nome:"xl/worksheets/sheet1.xml", texto: sheet}
  ]);
}

async function exportar(formato){
  if(!DOWNLOADS) return;
  const n = linhasClientes().length;
  try{
    if(formato==="csv"){
      await DOWNLOADS.save({filename: nomeArquivo("csv"), data: montaCSV()});
    } else {
      const bytes = montaXLSX();
      await DOWNLOADS.save({filename: nomeArquivo("xlsx"),
        data: new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
    }
    toast(n+" clientes exportados");
  }catch(err){
    const cod = err && err.code;
    if(cod === "declined") return;                       // o usuário decidiu não salvar
    if(cod === "rate_limited") toast("Aguarde um instante e tente de novo");
    else toast("Não foi possível exportar agora");
  }
}

/* ============================= render ============================= */
const TITULOS = {
  agenda:["Agenda","Quem vem hoje"],
  resultados:["Resultados","Quanto a cadeira rendeu"],
  clientes:["Clientes","Quem volta e quem sumiu"],
  followup:["Follow-up","A fila de hoje"]
};
function render(){
  document.getElementById("page-title").textContent = TITULOS[nav][0];
  document.getElementById("page-sub").textContent = TITULOS[nav][1];
  document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current", String(b.dataset.nav===nav)));
  const fu = CLIENTES.filter(c=>{
    const s=STATS[c.id];
    return s.qtd>0 && ["atrasado","em-risco","perdido","novo"].includes(s.faixa) && !contatados.has(c.id);
  }).length;
  document.getElementById("fu-badge").textContent = Math.min(fu,14);
  view.innerHTML =
    nav==="agenda" ? agendaHTML() :
    nav==="resultados" ? resultadosHTML() :
    nav==="clientes" ? clientesHTML() : followupHTML();
  const bs = document.getElementById("busca");
  if(bs){ bs.addEventListener("input", e=>{ busca=e.target.value.toLowerCase();
    const pos=e.target.selectionStart; render();
    const nb=document.getElementById("busca"); if(nb){ nb.focus(); nb.setSelectionRange(pos,pos); } }); }
}

/* ============================= eventos ============================= */
document.addEventListener("click", e=>{
  if(menuExp && !e.target.closest(".expwrap")){ menuExp = false; render(); }
  const t = e.target.closest("[data-nav],[data-go],[data-modo],[data-pro],[data-faixa],[data-sort],[data-clear],[data-exp],[data-appt],[data-cli],[data-slot],[data-close],[data-st],[data-del],[data-confirm],[data-copy],[data-fudone],[data-fucopy],[data-novo-cli]");
  if(!t) return;

  if(t.dataset.close){ fecharOverlay(); return; }
  if(t.dataset.nav){ nav=t.dataset.nav; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.go){
    if(t.dataset.go==="hoje") agendaDia=new Date(TODAY);
    else agendaDia = addDays(agendaDia, parseInt(t.dataset.go,10)*(agendaModo==="semana"?7:1));
    render(); return;
  }
  if(t.dataset.modo){ agendaModo=t.dataset.modo; render(); return; }
  if(t.dataset.pro && !t.dataset.slot){ filtroPro=t.dataset.pro; render(); return; }
  if(t.dataset.faixa){ filtroFaixa=t.dataset.faixa; render(); return; }
  if(t.dataset.sort){
    const k = t.dataset.sort;
    const col = COLUNAS.find(c=>c.k===k);
    if(ordem.campo===k) ordem.dir = ordem.dir==="asc" ? "desc" : "asc";
    else ordem = {campo:k, dir:col.padrao};
    render(); return;
  }
  if(t.dataset.clear){
    busca=""; filtroFaixa="todas"; ordem={campo:"total", dir:"desc"};
    render(); toast("Filtros limpos"); return;
  }
  if(t.dataset.exp){
    const acao = t.dataset.exp;
    if(acao==="menu"){ menuExp = !menuExp; render(); return; }
    menuExp = false; render(); exportar(acao); return;
  }
  if(t.dataset.appt){ abrirAgendamento(t.dataset.appt); return; }
  if(t.dataset.cli){ abrirCliente(t.dataset.cli); return; }
  if(t.dataset.novoCli){ abrirNovo({clienteId:t.dataset.novoCli}); return; }
  if(t.dataset.slot){
    if(t.classList.contains("off")) return;
    abrirNovo({proId:t.dataset.pro, inicio:parseInt(t.dataset.slot,10), data:iso(agendaDia)});
    return;
  }
  if(t.dataset.st){
    const [st,id]=t.dataset.st.split("|");
    const a=AGENDAMENTOS.find(x=>x.id===id);
    if(!a || a.status===st) return;
    a.status=st; recalcStats();
    render();                 // agenda e painel atrás
    abrirAgendamento(id);     // e o próprio modal, já com a opção certa marcada
    toast("Status: "+STATUS[st].rot);
    return;
  }
  if(t.dataset.del){
    const i=AGENDAMENTOS.findIndex(x=>x.id===t.dataset.del);
    if(i>=0) AGENDAMENTOS.splice(i,1);
    fecharOverlay(); render(); toast("Bloqueio removido");
    return;
  }
  if(t.dataset.confirm){
    const a=AGENDAMENTOS.find(x=>x.id===t.dataset.confirm);
    if(a) a.status="confirmado";
    confirmadosHoje.add(t.dataset.confirm); render(); toast("Cliente confirmado");
    return;
  }
  if(t.dataset.copy){
    const a=AGENDAMENTOS.find(x=>x.id===t.dataset.copy), c=cliById(a.clienteId), s=srvById(a.servicoId);
    copiar("Oi, "+c.nome.split(" ")[0]+"! Confirmando seu horário de amanhã às "+hm(a.inicio)+" para "+s.nome.toLowerCase()+". Posso manter?");
    return;
  }
  if(t.dataset.fudone){ contatados.add(t.dataset.fudone); render(); toast("Marcado como contatado"); return; }
  if(t.dataset.fucopy){
    const c=cliById(t.dataset.fucopy);
    copiar(mensagemFU(c, STATS[c.id]));
    return;
  }
});

const tipbox = document.createElement("div");
tipbox.id = "tipbox";
document.body.appendChild(tipbox);
function mostraTip(el){
  const texto = el.getAttribute("data-tip");
  if(!texto) return;
  tipbox.textContent = texto;
  tipbox.classList.add("on");
  const larg = Math.min(262, window.innerWidth - 24);
  tipbox.style.width = larg + "px";
  tipbox.style.top = "-9999px";
  const r = el.getBoundingClientRect(), alt = tipbox.offsetHeight;
  let x = r.left + r.width/2 - larg/2;
  x = Math.max(12, Math.min(x, window.innerWidth - larg - 12));
  let y = r.bottom + 8;
  if(y + alt > window.innerHeight - 8) y = Math.max(8, r.top - alt - 8);
  tipbox.style.left = Math.round(x) + "px";
  tipbox.style.top  = Math.round(y) + "px";
}
function escondeTip(){ tipbox.classList.remove("on"); tipbox.style.top = "-9999px"; }
document.addEventListener("mouseover", e=>{ const b = e.target.closest(".info"); if(b) mostraTip(b); });
document.addEventListener("mouseout",  e=>{ if(e.target.closest(".info")) escondeTip(); });
document.addEventListener("focusin",   e=>{ const b = e.target.closest(".info"); if(b) mostraTip(b); });
document.addEventListener("focusout",  e=>{ if(e.target.closest(".info")) escondeTip(); });
window.addEventListener("scroll", escondeTip, true);
window.addEventListener("resize", escondeTip);
